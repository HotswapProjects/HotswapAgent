name: Java CI with Maven

on:
  push:
    branches: [ "for_action","master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache DCEVM 11
        id: cache-dcevm
        uses: actions/cache@v4
        with:
          path: dcevm-11.0.15+1
          key: dcevm-11.0.15+1-linux-x64

      - name: Set up DCEVM 11
        if: steps.cache-dcevm.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o jdk.tar.gz https://github.com/TravaOpenJDK/trava-jdk-11-dcevm/releases/download/dcevm-11.0.15%2B1/Openjdk11u-dcevm-linux-x64.tar.gz
          tar -xzf jdk.tar.gz
          export JAVA_HOME=$PWD/dcevm-11.0.15+1
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
        shell: bash

      - name: Maven install
        run: |
          export JAVA_HOME=$PWD/dcevm-11.0.15+1
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
          mvn -B clean install
        shell: bash
